<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#4F46E5" />
      <stop offset="50%" stopColor="#6366F1" />
      <stop offset="100%" stopColor="#7C3AED" />
    </linearGradient>
    <linearGradient id="nogiGrad" x1="100" y1="100" x2="412" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFA63D" />
      <stop offset="50%" stopColor="#FF7A18" />
      <stop offset="100%" stopColor="#EA580C" />
    </linearGradient>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Soft Glow -->
  <circle cx="256" cy="270" r="160" fill="#FFA63D" opacity="0.25" filter="blur(20px)" />

  <!-- Nogi Mascot Body -->
  <path
    d="M 180 170 
       C 200 110, 312 110, 332 170 
       C 352 210, 380 280, 396 350 
       C 408 400, 350 430, 290 430 
       C 256 430, 210 430, 180 430 
       C 120 430, 100 400, 116 350 
       C 132 280, 160 210, 180 170 Z"
    fill="url(#nogiGrad)"
    stroke="#C2410C"
    stroke-width="8"
  />

  <!-- Eyes -->
  <circle cx="210" cy="245" r="24" fill="#1E293B" />
  <circle cx="302" cy="245" r="24" fill="#1E293B" />
  <circle cx="220" cy="235" r="9" fill="#FFFFFF" />
  <circle cx="312" cy="235" r="9" fill="#FFFFFF" />
  <circle cx="206" cy="252" r="4" fill="#FFFFFF" />
  <circle cx="298" cy="252" r="4" fill="#FFFFFF" />

  <!-- Cheeks Blush -->
  <circle cx="175" cy="285" r="18" fill="#FF4F79" opacity="0.6" />
  <circle cx="337" cy="285" r="18" fill="#FF4F79" opacity="0.6" />

  <!-- Mouth -->
  <path d="M 230 285 Q 256 325 282 285" fill="#991B1B" stroke="#7F1D1D" stroke-width="6" stroke-linecap="round" />

  <!-- Sparkle Antenna -->
  <path d="M 256 125 Q 256 75 285 65" stroke="#F59E0B" stroke-width="10" stroke-linecap="round" />
  <circle cx="285" cy="65" r="16" fill="#FBBF24" />
  <circle cx="285" cy="65" r="9" fill="#FEF08A" />

  <!-- Graduation Cap / NG Badge -->
  <rect x="330" y="360" width="110" height="42" rx="21" fill="#4338CA" stroke="#FFFFFF" stroke-width="5" />
  <text x="385" y="388" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle">NG</text>
</svg>
